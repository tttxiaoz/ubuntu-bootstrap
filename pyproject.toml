[project]
name = "ubuntu-bootstrap"
version = "0.1.0"
description = "Ubuntu 新机初始化工具（纯 Python 标准库，零运行时依赖）"
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]
tui = [
    "rich",
    "questionary",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501 由 line-length 统一控制，其余 pycodestyle 规则保留
ignore = []
